<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://open.spotify.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; frame-src 'self' https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Memory Match — Jovia Arcade</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/images/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="icon" href="/images/favicon-96.png" type="image/png" sizes="96x96">
  <link rel="icon" href="/images/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="games.css">
</head>
<body>
  <div class="game">
    <header class="game-bar">
      <strong>Memory Match</strong>
      <span>Moves: <b id="moves">0</b></span>
      <span>Pairs: <b id="pairs">0</b>/8</span>
      <button type="button" id="restart">New game</button>
    </header>
    <div class="grid" id="grid" aria-label="Memory cards"></div>
    <p class="game-msg" id="msg">Flip two cards to find a matching pair.</p>
  </div>
  <script src="activity.js"></script>
  <script src="memory.js"></script>
</body>
</html>
